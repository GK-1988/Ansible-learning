- name: demo on debug
  hosts: local
  connection: local
  vars: 
    course: DevOps
    name: Gopi Krishna
    city: Pune

  tasks:
    - name: print Hello World
      debug:
        msg: "Hello Ansible..!"
    - name: print Learning Ansible
      debug:
        msg: "Learning Ansible"
    - name: print the message
      debug: 
        msg: "Course is {{ course }}"
    - name: print message
      debug:
        msg: "My name is {{ name }}, I live in {{ pune }}"
        
